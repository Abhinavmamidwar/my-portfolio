<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Edit Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c10;
            color: #e5e9f0;
            line-height: 1.6;
        }

        .admin-header {
            background: #1a1f2e;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3b82f6;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .admin-header h1 {
            font-size: 1.5rem;
            color: #3b82f6;
        }

        .save-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .save-btn:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            background: #1a1f2e;
            padding: 1rem;
            border-radius: 12px;
        }

        .tab-btn {
            padding: 0.8rem 1.5rem;
            background: transparent;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            color: #e5e9f0;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .tab-btn.active {
            background: #3b82f6;
            color: white;
        }

        .tab-btn:hover {
            background: #3b82f6;
            color: white;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        .section-card {
            background: #1a1f2e;
            border: 1px solid #3b82f6;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: #3b82f6;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #3b82f6;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #0a0c10;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .items-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1rem 0;
            padding: 1rem;
            background: #0a0c10;
            border-radius: 8px;
            min-height: 50px;
        }

        .item-tag {
            background: #3b82f6;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .item-tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .add-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .project-card,
        .experience-card,
        .education-card,
        .certificate-card {
            background: #0a0c10;
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-new-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }

        .preview-btn {
            position: fixed;
            bottom: 20px;
            right: 80px;
            background: #3b82f6;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 999;
        }

        .preview-btn:hover {
            transform: scale(1.1);
        }

        .admin-logout {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ef4444;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 999;
        }

        .admin-logout:hover {
            transform: rotate(90deg);
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

                <button class="add-new-btn" onclick="addHighlight()">

        <div id="skills-tab" class="tab-pane">

        <!-- Experience Tab -->

        <!-- Contact Tab -->

                <div class="form-group">

            </div>
        </div>
    </div>

    <a href="index.html" class="preview-btn" target="_blank">

        // Load data from localStorage
        function loadData() {
            const saved = localStorage.getItem('portfolioData');
            if (saved) {
                portfolioData = JSON.parse(saved);
            }
            renderAllTabs();
        }

        // Save data
        function saveAllData() {
            updateDataFromForms();
            localStorage.setItem('portfolioData', JSON.stringify(portfolioData));
            
            // Download as JSON file
            const blob = new Blob([JSON.stringify(portfolioData, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data.json';
            a.click();
            
            alert('Data saved! File downloaded. Upload this to your hosting to update the live site.');
        }

        // Switch tabs
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        };

        // Render all tabs
        function renderAllTabs() {
            // Personal
            document.getElementById('personal-name').value = portfolioData.personal.name;

            document.getElementById('personal-email').value = portfolioData.personal.email;
            document.getElementById('personal-phone').value = portfolioData.personal.phone;
            document.getElementById('personal-location').value = portfolioData.personal.location;
            
            // Profile
            document.getElementById('profile-image').value = portfolioData.profile.image;
            document.getElementById('profile-preview').src = portfolioData.profile.image;
            
            // About
            document.getElementById('about-title').value = portfolioData.about.title;
            document.getElementById('about-desc1').value = portfolioData.about.description1;
            document.getElementById('about-desc2').value = portfolioData.about.description2;
            
            renderHighlights();
            renderStats();
            renderSkills();
            renderProjects();
            renderExperience();
            renderEducation();
            renderCertificates();
            
            // Social
            document.getElementById('social-linkedin').value = portfolioData.social.linkedin;
            document.getElementById('social-github').value = portfolioData.social.github;
            document.getElementById('social-twitter').value = portfolioData.social.twitter;
        }

        // Highlights
        function renderHighlights() {
            const container = document.getElementById('highlights-container');
            container.innerHTML = portfolioData.about.highlights.map((h, index) => `
                <div class="project-card">
                    <div class="card-header">
                        <h3>Highlight ${index + 1}</h3>
                        <button class="delete-btn" onclick="deleteHighlight(${index})">Delete</button>
                    </div>
                    <div class="form-group">
                        <label>Icon</label>
                        <input type="text" value="${h.icon}" onchange="updateHighlight(${index}, 'icon', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Text</label>
                        <input type="text" value="${h.text}" onchange="updateHighlight(${index}, 'text', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" value="${h.desc}" onchange="updateHighlight(${index}, 'desc', this.value)">
                    </div>
                </div>
            `).join('');
        }

        window.addHighlight = function() {
            portfolioData.about.highlights.push({ icon: "star", text: "New Highlight", desc: "Description" });
            renderHighlights();
        };

        window.deleteHighlight = function(index) {
            portfolioData.about.highlights.splice(index, 1);
            renderHighlights();
        };

        window.updateHighlight = function(index, field, value) {
            portfolioData.about.highlights[index][field] = value;
        };

        // Stats
        function renderStats() {
            const container = document.getElementById('stats-container');
            container.innerHTML = portfolioData.about.stats.map((stat, index) => `
                <div class="project-card">
                    <div class="card-header">
                        <h3>Stat ${index + 1}</h3>
                        <button class="delete-btn" onclick="deleteStat(${index})">Delete</button>
                    </div>
                    <div class="form-group">
                        <label>Number</label>
                        <input type="text" value="${stat.number}" onchange="updateStat(${index}, 'number', this.value)">
                    </div>
                    <div class="form-group">

                        <input type="text" value="${stat.label}" onchange="updateStat(${index}, 'label', this.value)">
